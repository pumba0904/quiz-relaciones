<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Entrenadores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
        }
        .page-title {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        .btn-agregar {
            background: linear-gradient(90deg, #e94560, #c72f4a);
            border: none;
            border-radius: 10px;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: white;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn-agregar:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }
        .btn-volver {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 0.6rem 1.4rem;
            color: rgba(255,255,255,0.7);
            transition: background 0.2s;
        }
        .btn-volver:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .table-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .table {
            margin: 0;
            color: white;
        }
        .table thead tr {
            background: rgba(233,69,96,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .table thead th {
            color: rgba(255,255,255,0.85);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            border: none;
            padding: 1rem 1.25rem;
        }
        .table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: background 0.2s;
        }
        .table tbody tr:last-child { border-bottom: none; }
        .table tbody tr:hover { background: rgba(255,255,255,0.07); }
        .table tbody td {
            color: rgba(255,255,255,0.85);
            border: none;
            padding: 0.9rem 1.25rem;
            vertical-align: middle;
        }
        .badge-id {
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
        }
        .badge-nacionalidad {
            background: rgba(233,69,96,0.2);
            border: 1px solid rgba(233,69,96,0.3);
            border-radius: 8px;
            padding: 0.2rem 0.6rem;
            font-size: 0.82rem;
            color: #f47b8f;
            font-weight: 500;
        }
        .badge-edad {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 0.2rem 0.6rem;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.6);
        }
        .empty-state {
            padding: 3rem;
            color: rgba(255,255,255,0.3);
            text-align: center;
        }
        .divider { border-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
<div class="container py-5">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <div class="page-title">🧑‍💼 Entrenadores</div>
            <div class="subtitle">Lista de todos los entrenadores registrados</div>
        </div>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-volver">← Inicio</a>
            <a href="/entrenadores/nuevo" class="btn btn-agregar">+ Agregar Entrenador</a>
        </div>
    </div>

    <hr class="divider mb-4"/>

    <!-- Tabla -->
    <div class="table-card">
        <table class="table" style="--bs-table-bg: transparent; --bs-table-striped-bg: transparent;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Nacionalidad</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${entrenadores}">
                    <td><span class="badge-id" th:text="${e.id}"></span></td>
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.apellido}"></td>
                    <td><span class="badge-edad" th:text="${e.edad} + ' años'"></span></td>
                    <td><span class="badge-nacionalidad" th:text="${e.nacionalidad}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(entrenadores)}">
                    <td colspan="5" class="empty-state">No hay entrenadores registrados aún.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
