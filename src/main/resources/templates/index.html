<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Fútbol</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
        }
        .card-menu {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            transition: transform 0.3s, background 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .card-menu:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .emoji-icon {
            font-size: 3rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: bold;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
<div class="container mt-5 text-center">
    <div class="mb-5">
        <div style="font-size: 4rem;">⚽</div>
        <h1>Gestión de Fútbol</h1>
        <p class="subtitle">Sistema de administración de clubes y relaciones JPA</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <a href="/clubes" class="card-menu d-block p-4">
                <div class="emoji-icon">🏟️</div>
                <h4 class="mt-3">Clubes</h4>
                <p class="subtitle">Gestiona los clubes de fútbol</p>
            </a>
        </div>
        <div class="col-md-4">
            <a href="/entrenadores" class="card-menu d-block p-4">
                <div class="emoji-icon">🧑‍💼</div>
                <h4 class="mt-3">Entrenadores</h4>
                <p class="subtitle">Gestiona los entrenadores</p>
            </a>
        </div>
        <div class="col-md-4">
            <a href="/jugadores" class="card-menu d-block p-4">
                <div class="emoji-icon">⚽</div>
                <h4 class="mt-3">Jugadores</h4>
                <p class="subtitle">Gestiona los jugadores</p>
            </a>
        </div>
        <div class="col-md-4">
            <a href="/asociaciones" class="card-menu d-block p-4">
                <div class="emoji-icon">🏢</div>
                <h4 class="mt-3">Asociaciones</h4>
                <p class="subtitle">Gestiona las asociaciones</p>
            </a>
        </div>
        <div class="col-md-4">
            <a href="/competiciones" class="card-menu d-block p-4">
                <div class="emoji-icon">🏆</div>
                <h4 class="mt-3">Competiciones</h4>
                <p class="subtitle">Gestiona las competiciones</p>
            </a>
        </div>
    </div>
</div>
</body>
</html>
