<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Nuevo Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '🏟️';
      position: fixed;
      font-size: 22rem;
      opacity: 0.03;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.2), transparent 70%);
      top: -100px; right: -100px;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(16,185,129,0.15), transparent 70%);
      bottom: -80px; left: -80px;
    }

    .form-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      animation: slideUp 0.5s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.45);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.85); }
    .back-link::before { content: '←'; font-size: 1rem; }

    .card-dark {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 2.4rem 2.2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .form-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 2rem;
    }
    .form-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, rgba(99,102,241,0.35), rgba(16,185,129,0.25));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.06em;
      color: #fff;
      line-height: 1;
    }
    .form-subtitle {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      margin-bottom: 1.8rem;
    }

    .field-group { margin-bottom: 1.25rem; }

    .field-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 7px;
    }
    .field-label .dot {
      width: 5px; height: 5px;
      background: #6366f1;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .field-input,
    .field-select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 11px 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.93rem;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .field-input::placeholder { color: rgba(255,255,255,0.22); }
    .field-input:focus,
    .field-select:focus {
      border-color: rgba(99,102,241,0.7);
      background: rgba(99,102,241,0.07);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.4);
      pointer-events: none;
      font-size: 0.85rem;
    }

    .field-select option {
      background: #1a1a2e;
      color: #fff;
    }

    /* Select múltiple */
    .field-select[multiple] {
      padding: 6px 4px;
      min-height: 110px;
    }
    .field-select[multiple] option {
      padding: 6px 10px;
      border-radius: 6px;
      margin: 2px 4px;
    }
    .field-select[multiple] option:checked {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
    }
    .select-hint {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      margin-top: 5px;
    }

    .btn-save {
      width: 100%;
      padding: 13px;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 11px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
    }
    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99,102,241,0.5);
    }
    .btn-save:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="form-wrapper">
    <a href="/clubes" class="back-link">Volver a Clubes</a>

    <div class="card-dark">
      <div class="form-header">
        <div class="form-icon">🏟️</div>
        <div>
          <div class="form-title">Agregar Club</div>
          <div class="form-subtitle">Nuevo club de fútbol</div>
        </div>
      </div>

      <div class="divider"></div>

      <form th:action="@{/clubes/guardar}" th:object="${club}" method="post">

        <div class="field-group">
          <label class="field-label"><span class="dot"></span> Nombre</label>
          <input type="text" class="field-input" th:field="*{nombre}" placeholder="Ej. Real Madrid, Millonarios..."/>
        </div>

        <div class="field-group">
          <label class="field-label"><span class="dot"></span> Entrenador</label>
          <div class="select-wrapper">
            <select class="field-select" th:field="*{entrenador}">
              <option value="">Sin entrenador</option>
              <option th:each="e : ${entrenadores}" th:value="${e.id}" th:text="${e.nombre}"></option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label"><span class="dot"></span> Asociación</label>
          <div class="select-wrapper">
            <select class="field-select" th:field="*{asociacion}">
              <option value="">Sin asociación</option>
              <option th:each="a : ${asociaciones}" th:value="${a.id}" th:text="${a.nombre}"></option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label"><span class="dot"></span> Competiciones</label>
          <select class="field-select" th:field="*{competiciones}" multiple>
            <option th:each="c : ${competiciones}" th:value="${c.id}" th:text="${c.nombre}"></option>
          </select>
          <div class="select-hint">Mantén Ctrl (o Cmd) para seleccionar varias</div>
        </div>

        <button type="submit" class="btn-save">✓ &nbsp;Guardar Club</button>
      </form>
    </div>
  </div>
</body>
</html>
