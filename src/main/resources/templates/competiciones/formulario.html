<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nueva Competición</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
        }
        .form-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 500px;
            margin: auto;
            backdrop-filter: blur(10px);
        }
        .form-card h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .form-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: white;
            padding: 0.65rem 1rem;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.35);
            color: white;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.07);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }
        .btn-guardar {
            background: linear-gradient(90deg, #e94560, #c72f4a);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn-guardar:hover { opacity: 0.9; transform: translateY(-2px); color: white; }
        .btn-volver {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 0.75rem;
            color: rgba(255,255,255,0.7);
            transition: background 0.2s;
        }
        .btn-volver:hover { background: rgba(255,255,255,0.15); color: white; }
        .divider { border-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="form-card">
        <h2>🏆 Agregar Competición</h2>
        <hr class="divider mb-4"/>
        <form th:action="@{/competiciones/guardar}" th:object="${competicion}" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Liga Premier"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Monto Premio</label>
                <input type="number" class="form-control" th:field="*{montoPremio}" placeholder="0"/>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label">Fecha Inicio</label>
                    <input type="date" class="form-control" th:field="*{fechaInicio}"/>
                </div>
                <div class="col-6">
                    <label class="form-label">Fecha Fin</label>
                    <input type="date" class="form-control" th:field="*{fechaFin}"/>
                </div>
            </div>
            <button type="submit" class="btn btn-guardar w-100 mb-2">Guardar</button>
        </form>
        <a href="/competiciones" class="btn btn-volver w-100 text-center d-block">← Volver</a>
    </div>
</div>
</body>
</html>
